[build-system]
requires = ["setuptools>=79.0", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autogalaxy"
dynamic = ["version"]
description="Open-Source Multi Wavelength Galaxy Structure & Morphology"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "James Nightingale", email = "James.Nightingale@newcastle.ac.uk" },
    { name = "Richard Hayes", email = "richard@rghsoftware.co.uk" },
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]
keywords = ["cli"]
dependencies = [
    # Floors, not pins. Without them, pip backtracking the extras chain
    # (autogalaxy[jax] -> autofit[jax] -> autonerves[jax]) may walk the release
    # history to 2022: "version X does not provide the extra 'jax'" is a pip
    # *warning*, not an error, so a pre-extras release is a legal solution.
    # PyAutoLens#687.
    "autofit>=2026.7.29.2",
    "autoarray>=2026.7.29.2",
    "astropy>=5.0",
    "nautilus-sampler==1.0.5"
]

[project.urls]
Homepage = "https://github.com/PyAutoLabs/PyAutoGalaxy"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["docs", "test_autogalaxy", "test_autogalaxy*"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"  


[project.optional-dependencies]
jax = [
    # autofit[jax] rather than autonerves[jax] directly: it supplies everything
    # autonerves[jax] does *plus* optax, which autofit's JAX-native gradient MAP
    # searches (MultiStartAdam / MultiStartProdigy) import. Without it the chain
    # autolens[jax] -> autogalaxy[jax] stopped at autonerves[jax], so `pip
    # install autolens[jax]` left those searches raising ImportError.
    "autofit[jax]>=2026.7.29.2",
    "jax_zero_contour>=2.0.0,<3.0.0"
]
optional = [
    "autogalaxy[jax]",
    "numba",
    "pynufft",
    "zeus-mcmc==2.5.4",
    "getdist==1.4"
]
docs=[
    "sphinx",
    "furo",
    "myst-parser",
    "sphinx_copybutton",
    "sphinx_design",
    "sphinx_inline_tabs",
    "sphinx_autodoc_typehints"
]
test = ["pytest", "colossus==1.3.1"]
dev = ["pytest", "black", "colossus==1.3.1"]

[tool.setuptools.package-data]
"autogalaxy.config" = ["*"]

[tool.pytest.ini_options]
testpaths = ["test_autogalaxy"]
filterwarnings = [
    "ignore:cuda_plugin_extension:UserWarning",
    "ignore::DeprecationWarning:jax",
]

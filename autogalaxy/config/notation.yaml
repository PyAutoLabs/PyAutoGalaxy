    gamma_1: \gamma # Plot label used for the gamma_1 parameter.
    gamma_2: \gamma # Plot label used for the gamma_2 parameter.
    inner_coefficient: \lambda_{\rm 1} # Plot label used for the inner_coefficient parameter.
    inner_slope: t_{\rm 1} # Plot label used for the inner_slope parameter.
    intensity: I_{\rm b} # Plot label used for the intensity parameter.
    kappa: \kappa # Plot label used for the kappa parameter.
    kappa_s: \kappa_{\rm s} # Plot label used for the kappa_s parameter.

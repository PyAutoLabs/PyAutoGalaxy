    centre_1: x # Plot label used for the centre_1 parameter.
    coefficient: \lambda # Plot label used for the coefficient parameter.
    c_2: c_{\rm 2} # Plot label used for the c_2 parameter.
    concentration: conc # Plot label used for the concentration parameter.
    core_radius: C_{\rm r} # Plot label used for the core_radius parameter.
    core_radius_0: C_{rm r0} # Plot label used for the core_radius_0 parameter.
    core_radius_1: C_{\rm r1} # Plot label used for the core_radius_1 parameter.
    effective_radius: R_{\rm eff} # Plot label used for the effective_radius parameter.
    einstein_radius: \theta_{\rm Ein} # Plot label used for the einstein_radius parameter.

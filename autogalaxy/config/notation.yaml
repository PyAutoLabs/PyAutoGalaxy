    mass_to_light_ratio_base: \Psi_{\rm base} # Plot label used for the mass_to_light_ratio_base parameter.
    mass_to_light_radius: R_{\rm ref} # Plot label used for the mass_to_light_radius parameter.
    noise_factor: \omega_{\rm 1} # Plot label used for the noise_factor parameter.
    noise_power: \omega{\rm 2} # Plot label used for the noise_power parameter.
    noise_scale: \sigma_{\rm 1} # Plot label used for the noise_scale parameter.
    normalization_scale: n # Plot label used for the normalization_scale parameter.
    outer_coefficient: \lambda_{\rm 2} # Plot label used for the outer_coefficient parameter.
    outer_slope: t_{\rm 2} # Plot label used for the outer_slope parameter.
    overdens: \Delta_{\rm vir} # Plot label used for the overdens parameter.
    pixels: N_{\rm pix} # Plot label used for the pixels parameter.
    ra: r_{\rm a} # Plot label used for the ra parameter.
    radius_break: R_{\rm b} # Plot label used for the radius_break parameter.
    redshift: z # Plot label used for the redshift parameter.
    redshift_object: z_{\rm obj} # Plot label used for the redshift_object parameter.
    redshift_source: z_{\rm src} # Plot label used for the redshift_source parameter.
    rs: r_{\rm s} # Plot label used for the rs parameter.
    scale_radius: R_{\rm s} # Plot label used for the scale_radius parameter.
    scatter: \sigma # Plot label used for the scatter parameter.
    separation: s # Plot label used for the separation parameter.
    sersic_index: n # Plot label used for the sersic_index parameter.
    shape_0: y_{\rm pix} # Plot label used for the shape_0 parameter.
    shape_1: x_{\rm pix} # Plot label used for the shape_1 parameter.
    signal_scale: V # Plot label used for the signal_scale parameter.
    sky_scale: \sigma_{\rm 0} # Plot label used for the sky_scale parameter.
    slope: \gamma # Plot label used for the slope parameter.
    truncation_radius: R_{\rm t} # Plot label used for the truncation_radius parameter.
    virial_mass: M_{\rm vir} # Plot label used for the virial_mass parameter.
    virial_overdens: \Delta_{\rm vir} # Plot label used for the virial_overdens parameter.
    weight_floor: W_{\rm f} # Plot label used for the weight_floor parameter.
    weight_power: W_{\rm p} # Plot label used for the weight_power parameter.
    zeroth_coefficient: \lambda_{\rm 0} # Plot label used for the zeroth_coefficient parameter.
    zeroth_signal_scale: V # Plot label used for the zeroth_signal_scale parameter.
  superscript:
    ExternalShear: ext # Class suffix for an unnamed ExternalShear Model; named components use component paths.
    GaussianRandomField: grf # Class suffix for an unnamed GaussianRandomField Model; named components use component paths.
    InputDeflections: input # Class suffix for an unnamed InputDeflections Model; named components use component paths.
    InputPotential: input # Class suffix for an unnamed InputPotential Model; named components use component paths.
    Mesh: mesh # Class suffix for an unnamed Mesh Model; named components use component paths.
    Point: point # Class suffix for an unnamed Point Model; named components use component paths.
    SMBH: smbh # Class suffix for an unnamed SMBH Model; named components use component paths.
    Redshift: z # Class suffix for an unnamed Redshift Model; named components use component paths.
    Regularization: reg # Class suffix for an unnamed Regularization Model; named components use component paths.
